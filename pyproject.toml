[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "0.1.0"
description = "Personal knowledge base with MCP auto-memory extraction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "aiosqlite>=0.20",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf2>=3.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
memora = "memora.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
